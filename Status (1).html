<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Festival Status Maker</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

    <style>
        :root { --whatsapp-green: #25D366; }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        
        body { background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }

        .feed-container {
            height: 100vh;
            height: 100dvh;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            -webkit-overflow-scrolling: touch;
        }

        .card {
            position: relative;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            scroll-snap-align: start;
            display: flex;
            flex-direction: column;
            background: #111;
        }

        /* Top 85% - Template Area */
        .template-area {
            position: relative;
            width: 100%;
            height: 85%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }

        .template-img {
            height: 100%;
            width: 100%;
            object-fit: contain;
        }

        .interaction-layer {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            margin: auto;
            aspect-ratio: 9/16; 
            height: 100%;
        }

        /* Bottom 15% - Action Area */
        .action-bar {
            width: 100%;
            height: 15%;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            background: #1a1a1a;
            border-top: 1px solid #333;
        }

        /* UI Overlays */
        .photo-spot {
            position: absolute;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: rgba(255,255,255,0.1);
            border: 1px dashed rgba(255,255,255,0.5);
        }
        .photo-spot img { width: 100%; height: 100%; object-fit: cover; display: none; }
        .photo-spot.filled { border: none; background: transparent; }
        .photo-spot.filled img { display: block; }
        .photo-spot span { color: #fff; font-size: 10px; text-align: center; pointer-events: none; }

        .name-spot {
            position: absolute;
            z-index: 11;
            display: flex;
            justify-content: center;
        }
        .name-input {
            width: 90%;
            padding: 8px;
            text-align: center;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 16px; /* Prevents iOS zoom on focus */
        }
        .name-display {
            display: none;
            width: 100%;
            text-align: center;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .btn {
            padding: 12px 24px;
            border-radius: 25px;
            border: none;
            color: white;
            font-weight: bold;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .btn-whatsapp { background: var(--whatsapp-green); }
        .btn-download { background: #444; }

        /* Cropper Modal */
        #cropModal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 1000;
            display: none; flex-direction: column;
        }
        .crop-area { flex: 1; position: relative; }
        .crop-btns { height: 70px; display: flex; justify-content: space-between; align-items: center; padding: 0 30px; color: #fff; background: #111; font-weight: bold; }
    </style>
</head>
<body>

<div class="feed-container" id="feed"></div>
<input type="file" id="filePicker" accept="image/*" style="display:none">

<div id="cropModal">
    <div class="crop-area"><img id="cropTarget"></div>
    <div class="crop-btns">
        <div onclick="closeCrop()">Cancel</div>
        <div style="color: #4facfe" onclick="confirmCrop()">Apply All</div>
    </div>
</div>

<script>
    // Global User State
    let userData = {
        name: "",
        photoBase64: ""
    };

    const templates = [
        { id: 'bhogi1', url: 'https://i.postimg.cc/7hJktRxn/Bhogi-01.jpg', photo: { bottom: '2%', left: '2%', w: '38%', h: '30%', circle: false }, name: { bottom: '5%', right: '5%', w: '50%', color: '#00334e', size: '20px' }},
        { id: 'bhogi2', url: 'https://i.postimg.cc/ZR2RqpnN/Bhogi-02.jpg', photo: { bottom: '2%', left: '2%', w: '38%', h: '30%', circle: false }, name: { bottom: '4%', right: '5%', w: '50%', color: '#00334e', size: '20px' }},
        { id: 'cow-pongal', url: 'https://i.postimg.cc/g2m0rYcc/cow-pongal.jpg', photo: { bottom: '8%', left: '35%', w: '30%', h: '15%', circle: true }, name: { bottom: '1%', left: '30%', w: '40%', color: '#ffffff', size: '14px' }},
        { id: 'pongal-info', url: 'https://i.postimg.cc/fLGzssq6/pongal-info.jpg', photo: { bottom: '0%', left: '0%', w: '45%', h: '25%', circle: false }, name: { bottom: '4%', right: '5%', w: '55%', color: '#ffffff', size: '18px' }},
        { id: 'makara', url: 'https://i.postimg.cc/VLBYx3qg/makara-sa-ka-ra-ta-ya-sa-bha-sayagala.jpg', photo: { bottom: '10%', left: '35%', w: '30%', h: '18%', circle: true }, name: { bottom: '1%', left: '0%', w: '100%', color: '#ffffff', size: '18px' }}
    ];

    let cropper = null;

    function initFeed() {
        const feed = document.getElementById('feed');
        feed.innerHTML = ''; // Clear existing
        templates.forEach(t => {
            const card = document.createElement('div');
            card.className = 'card';
            card.id = t.id;
            card.innerHTML = `
                <div class="template-area" id="${t.id}-target">
                    <img src="${t.url}" class="template-img" crossorigin="anonymous">
                    <div class="interaction-layer">
                        <div class="photo-spot" 
                             style="bottom:${t.photo.bottom}; left:${t.photo.left}; width:${t.photo.w}; height:${t.photo.h}; border-radius:${t.photo.circle ? '50%' : '8px'}"
                             onclick="triggerUpload()">
                            <span>Tap to Add<br>Photo</span>
                            <img src="${userData.photoBase64}" style="${userData.photoBase64 ? 'display:block' : 'display:none'}">
                        </div>
                        <div class="name-spot" style="bottom:${t.name.bottom}; left:${t.name.left || 'auto'}; right:${t.name.right || 'auto'}; width:${t.name.w}">
                            <input type="text" class="name-input" placeholder="Enter Name" 
                                   value="${userData.name}" 
                                   oninput="syncName(this.value)" 
                                   onblur="lockAllNames()"
                                   style="${userData.name ? 'display:none' : 'display:block'}">
                            <div class="name-display" style="color:${t.name.color}; font-size:${t.name.size}; ${userData.name ? 'display:block' : 'display:none'}">${userData.name}</div>
                        </div>
                    </div>
                </div>
                <div class="action-bar">
                    <button class="btn btn-whatsapp" onclick="handleAction('${t.id}', 'share')">WhatsApp</button>
                    <button class="btn btn-download" onclick="handleAction('${t.id}', 'download')">Download</button>
                </div>
            `;
            feed.appendChild(card);
        });
    }

    // --- Synchronization Core ---
    function syncName(val) {
        userData.name = val;
        document.querySelectorAll('.name-input').forEach(input => {
            if (input !== document.activeElement) input.value = val;
        });
    }

    function lockAllNames() {
        if (!userData.name.trim()) return;
        document.querySelectorAll('.name-input').forEach(el => el.style.display = 'none');
        document.querySelectorAll('.name-display').forEach(el => {
            el.innerText = userData.name;
            el.style.display = 'block';
        });
    }

    function syncPhoto(base64) {
        userData.photoBase64 = base64;
        document.querySelectorAll('.photo-spot').forEach(spot => {
            const img = spot.querySelector('img');
            img.src = base64;
            img.style.display = 'block';
            spot.classList.add('filled');
            spot.querySelector('span').style.display = 'none';
        });
    }

    // --- Image Processing ---
    function triggerUpload() { document.getElementById('filePicker').click(); }

    document.getElementById('filePicker').onchange = function(e) {
        if (e.target.files && e.target.files[0]) {
            const reader = new FileReader();
            reader.onload = function(event) {
                const modal = document.getElementById('cropModal');
                const img = document.getElementById('cropTarget');
                img.src = event.target.result;
                modal.style.display = 'flex';
                if(cropper) cropper.destroy();
                cropper = new Cropper(img, { aspectRatio: 1, viewMode: 1, guides: false });
            }
            reader.readAsDataURL(e.target.files[0]);
        }
    };

    function confirmCrop() {
        const canvas = cropper.getCroppedCanvas({ width: 600, height: 600 });
        syncPhoto(canvas.toDataURL('image/jpeg', 0.8));
        closeCrop();
    }

    function closeCrop() {
        document.getElementById('cropModal').style.display = 'none';
        document.getElementById('filePicker').value = '';
    }

    // --- Export ---
    async function handleAction(cardId, mode) {
        const target = document.getElementById(`${cardId}-target`);
        // Force hide inputs for clean capture
        const canvas = await html2canvas(target, { useCORS: true, scale: 2, logging: false });
        
        if (mode === 'download') {
            const link = document.createElement('a');
            link.download = `greeting-${cardId}.png`;
            link.href = canvas.toDataURL("image/png");
            link.click();
        } else {
            canvas.toBlob(async (blob) => {
                const file = new File([blob], "status.png", { type: "image/png" });
                if (navigator.share) {
                    try {
                        await navigator.share({ files: [file], title: 'Festival Greeting' });
                    } catch (err) { console.log("Share failed", err); }
                } else {
                    alert("Sharing not supported. Please use Download.");
                }
            }, 'image/png');
        }
    }

    // Wait for libraries to load before initializing
    window.onload = () => {
        if (typeof Cropper !== 'undefined' && typeof html2canvas !== 'undefined') {
            initFeed();
        } else {
            alert("Internet required for first load to fetch design tools.");
        }
    };
</script>
</body>
</html>
